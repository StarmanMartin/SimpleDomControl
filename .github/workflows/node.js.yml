# Runs the Python (pytest + Django) and JS (jest) test suites of SimpleDomControl.

name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      run: pipx install poetry

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'

    - name: Enable Corepack (Yarn from packageManager)
      run: corepack enable

    - name: Install dependencies (Poetry)
      run: poetry install --with dev
      timeout-minutes: 10

    - name: Point the JS build and tests to the Poetry interpreter
      run: echo "PYTHON=\"$(poetry env info --executable)\"" > Assets/.sdc_python_env

    - name: Install dependencies (yarn)
      run: yarn install --frozen-lockfile
      timeout-minutes: 10

    - name: Run pytest
      run: poetry run pytest

    - name: Run Django tests
      run: |
        poetry run python manage.py sdc_open_api
        poetry run python manage.py test

    - name: Build JS assets
      run: yarn build

    - name: Run JS tests
      run: yarn sdc_test
