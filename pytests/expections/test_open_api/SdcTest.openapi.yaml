components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Author:
      type: object
      required:
      - model
      - pk
      - fields
      properties:
        model:
          type: string
          description: app_label.modelname
        pk:
          type: integer
        fields:
          $ref: '#/components/schemas/AuthorFields'
    AuthorFields:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        age:
          type: integer
    AuthorCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        age:
          type: integer
      required:
      - name
      - age
    AuthorEdit:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        age:
          type: integer
      required:
      - name
      - age
    AuthorPatch:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        age:
          type: integer
    Book:
      type: object
      required:
      - model
      - pk
      - fields
      properties:
        model:
          type: string
          description: app_label.modelname
        pk:
          type: integer
        fields:
          $ref: '#/components/schemas/BookFields'
    BookFields:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        author:
          type: integer
          nullable: true
    BookCreate:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        author:
          type: integer
          description: A Author id.
      required:
      - title
      - author
    BookEdit:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        author:
          type: integer
          description: A Author id.
      required:
      - title
      - author
    BookPatch:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        author:
          type: integer
          description: A Author id.
    BookContent:
      type: object
      required:
      - model
      - pk
      - fields
      properties:
        model:
          type: string
          description: app_label.modelname
        pk:
          type: integer
        fields:
          $ref: '#/components/schemas/BookContentFields'
    BookContentFields:
      type: object
      properties:
        user:
          type: integer
          nullable: true
        text:
          type: object
          nullable: true
          properties:
            name:
              type: string
            url:
              type: string
    BookContentCreate:
      type: object
      properties:
        user:
          type: integer
          description: A SdcUser id.
        text:
          type: string
          format: binary
          maxLength: 100
      required:
      - text
    BookContentEdit:
      type: object
      properties:
        user:
          type: integer
          description: A SdcUser id.
        text:
          type: string
          format: binary
          maxLength: 100
      required:
      - text
    BookContentPatch:
      type: object
      properties:
        user:
          type: integer
          description: A SdcUser id.
        text:
          type: string
          format: binary
          maxLength: 100
    SdcUser:
      type: object
      required:
      - model
      - pk
      - fields
      properties:
        model:
          type: string
          description: app_label.modelname
        pk:
          type: integer
        fields:
          $ref: '#/components/schemas/SdcUserFields'
    SdcUserFields:
      type: object
      properties:
        last_login:
          type: string
          format: date-time
          nullable: true
        is_superuser:
          type: boolean
          description: Designates that this user has all permissions without explicitly
            assigning them.
        username:
          type: string
          maxLength: 150
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
