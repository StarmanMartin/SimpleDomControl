components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: SDC API token
  schemas:
    ApiToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum:
          - personal
          - login
        prefix:
          type: string
          description: First characters of the token, to recognize it
        privileges:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_by_token:
          type: string
          format: uuid
          nullable: true
        is_valid:
          type: boolean
    Author:
      type: object
      required:
      - model
      - pk
      - fields
      properties:
        model:
          type: string
          description: app_label.modelname
        pk:
          type: integer
        fields:
          $ref: '#/components/schemas/AuthorFields'
    AuthorFields:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        age:
          type: integer
    AuthorCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        age:
          type: integer
      required:
      - name
      - age
    AuthorEdit:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        age:
          type: integer
      required:
      - name
      - age
    AuthorPatch:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        age:
          type: integer
    Book:
      type: object
      required:
      - model
      - pk
      - fields
      properties:
        model:
          type: string
          description: app_label.modelname
        pk:
          type: integer
        fields:
          $ref: '#/components/schemas/BookFields'
    BookFields:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        author:
          type: integer
          nullable: true
    BookCreate:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        author:
          type: integer
          description: A Author id.
      required:
      - title
      - author
    BookEdit:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        author:
          type: integer
          description: A Author id.
      required:
      - title
      - author
    BookPatch:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        author:
          type: integer
          description: A Author id.
    BookContent:
      type: object
      required:
      - model
      - pk
      - fields
      properties:
        model:
          type: string
          description: app_label.modelname
        pk:
          type: integer
        fields:
          $ref: '#/components/schemas/BookContentFields'
    BookContentFields:
      type: object
      properties:
        user:
          type: integer
          nullable: true
        text:
          type: object
          nullable: true
          properties:
            name:
              type: string
            url:
              type: string
    BookContentCreate:
      type: object
      properties:
        user:
          type: integer
          description: A SdcUser id.
        text:
          type: string
          format: binary
          maxLength: 100
      required:
      - text
    BookContentEdit:
      type: object
      properties:
        user:
          type: integer
          description: A SdcUser id.
        text:
          type: string
          format: binary
          maxLength: 100
      required:
      - text
    BookContentPatch:
      type: object
      properties:
        user:
          type: integer
          description: A SdcUser id.
        text:
          type: string
          format: binary
          maxLength: 100
    SdcUser:
      type: object
      required:
      - model
      - pk
      - fields
      properties:
        model:
          type: string
          description: app_label.modelname
        pk:
          type: integer
        fields:
          $ref: '#/components/schemas/SdcUserFields'
    SdcUserFields:
      type: object
      properties:
        last_login:
          type: string
          format: date-time
          nullable: true
        is_superuser:
          type: boolean
          description: Designates that this user has all permissions without explicitly
            assigning them.
        username:
          type: string
          maxLength: 150
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        is_staff:
          type: boolean
          description: Designates whether the user can log into this admin site.
        is_active:
          type: boolean
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        date_joined:
          type: string
          format: date-time
        email_confirmed:
          type: boolean
        groups:
          type: array
          items:
            type: integer
          description: The groups this user belongs to. A user will get all permissions
            granted to each of their groups.
        user_permissions:
          type: array
          items:
            type: integer
          description: Specific permissions for this user.
    SdcUserCreate:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        password1:
          type: string
          description: <ul><li>Your password can’t be too similar to your other personal
            information.</li><li>Your password must contain at least 8 characters.</li><li>Your
            password can’t be a commonly used password.</li><li>Your password can’t
            be entirely numeric.</li></ul>
        password2:
          type: string
      required:
      - username
      - password1
      - password2
    SdcUserEdit:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
      required:
      - username
    SdcUserPatch:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
security:
- BearerAuth: []
