openapi: 3.0.3
info:
  title: Auto Generated API
  version: 1.0.0
  description: 'REST API of the SdcModels. Authenticate with an API token (Authorization:
    Bearer sdc_...), created by the user in the web app or with POST /sdc_api/login/.
    Privileges of a token: model:<Model>:read, model:<Model>:write (create and change),
    model:<Model>:delete, model:*:<read|write|delete> for all models, account:read,
    account:write, account:tokens. A token never has more rights than its user.'
paths:
  /sdc_api/login/:
    get:
      summary: 'Deprecated: exchange a refresh JWT of SDC <= 0.162 for a login token'
      deprecated: true
      responses:
        '200':
          description: A login token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    enum:
                    - bearer
                  token_id:
                    type: string
                    format: uuid
                  expires_at:
                    type: string
                    format: date-time
                  privileges:
                    type: array
                    items:
                      type: string
        '401':
          description: Invalid credentials or token
        '410':
          description: Not a JWT
    post:
      summary: Log in with username and password and receive a short-lived login token
      description: 'Privileges of a token: model:<Model>:read, model:<Model>:write
        (create and change), model:<Model>:delete, model:*:<read|write|delete> for
        all models, account:read, account:write, account:tokens. A token never has
        more rights than its user. Without privileges the token gets all of them.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
                name:
                  type: string
                privileges:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: A login token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    enum:
                    - bearer
                  token_id:
                    type: string
                    format: uuid
                  expires_at:
                    type: string
                    format: date-time
                  privileges:
                    type: array
                    items:
                      type: string
        '401':
          description: Invalid credentials or token
        '400':
          description: Missing credentials, invalid JSON or unknown privileges
  /sdc_api/tokens/:
    get:
      summary: 'List the own API tokens (also revoked and expired ones). Privilege:
        account:read.'
      responses:
        '200':
          description: The tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiToken'
        '401':
          description: Missing, invalid or expired token
        '403':
          description: Not authorised
        '404':
          description: Not found
    post:
      summary: 'Create an API token with at most the privileges of the calling token.
        Privilege: account:tokens.'
      description: 'Privileges of a token: model:<Model>:read, model:<Model>:write
        (create and change), model:<Model>:delete, model:*:<read|write|delete> for
        all models, account:read, account:write, account:tokens. A token never has
        more rights than its user. The token is returned only in this response.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                privileges:
                  type: array
                  items:
                    type: string
                  description: 'Default: the privileges of the calling token'
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: 'Default: the default lifetime; null: no expiry'
      responses:
        '201':
          description: The new token
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  token:
                    type: string
                  data:
                    $ref: '#/components/schemas/ApiToken'
        '400':
          description: Invalid name, privileges or expiry
        '401':
          description: Missing, invalid or expired token
        '403':
          description: Not authorised
        '404':
          description: Not found
  /sdc_api/tokens/current/:
    get:
      summary: The calling token
      responses:
        '200':
          description: The token
          content:
            application/json:
