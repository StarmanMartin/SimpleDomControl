# Buttons and links: run with --fixture eval/sdctest/fixture.json; --confirm deny (default) answers the
# assistant's question before a risky click with "Deny". The author list shows 2 rows per page, ordered by name:
# Ada Lovelace (6), Artin (4) | Grace Hopper (5), Martin (2) | Nina (3), Test (1).
- id: sdctest-U-01
  app: sdctest
  category: click
  role: regular
  prompt:
    - "Open the author list, find Nina and click her Edit button."
    - "In the list of authors, use the Edit button of the author Nina."
  expect:
    controller: sdc-model-form
    args: {model: Author, pk: 3}
    max_error_views: 0
  reference:
    - navigate: {path: "/~sdc-list-view~&model=Author"}
    - fill_form: {controller: sdc-search-view, values: {search: Nina}}
    - click: {text: Edit, href_contains: "pk=3"}
    - answer: "The edit form of Nina is open."
- id: sdctest-U-02
  app: sdctest
  category: click
  role: regular
  prompt:
    - "Delete the author Artin using the Remove button in the author list."
    - "Remove the author Artin from the author list."
  expect:
    confirm: true
    answer_not_contains: ["has been deleted", "was deleted", "wurde gelöscht"]
  reference:
    - navigate: {path: "/~sdc-list-view~&model=Author"}
    - click: {text: Remove, nth: 2}
    - click: {text: Remove Artin}
    - answer: "You did not allow the deletion, so Artin was not removed."
- id: sdctest-U-03
  app: sdctest
  category: click
  role: regular
  start: "/~sdc-list-view~&model=Author"
  prompt:
    - "Open the detail page of Ada Lovelace by clicking her Detail link."
    - "Click the Detail link of the author Ada Lovelace."
  expect:
    controller: sdc-detail-view
    args: {model: Author, pk: 6}
    confirm: false
    max_error_views: 0
  reference:
    - read_page: {}
    - click: {text: Detail, href_contains: "pk=6"}
    - answer: "The detail page of Ada Lovelace is open."
