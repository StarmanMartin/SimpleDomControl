# Large lists: run with --fixture eval/sdctest/fixture_large.json (300 extra authors "Writer MMM", 1000 books
# "Atlas NNNN"). The author list (sdc-list-view, model Author) shows 2 rows per page, ordered by name, and has a
# search bar: every word of the search text must appear in the name or in a title of the author's books (so
# "Writer 2" also finds "Writer 012"; single words are unambiguous). Book "Atlas NNNN" has pk 101 + NNNN and the author "Writer MMM" with
# MMM = NNNN % 300 + 1 (author pk 100 + MMM).
- id: sdctest-L-01
  app: sdctest
  category: large-search
  role: regular
  prompt:
    - "Who wrote the book 'Atlas 0777'?"
    - "Find the book 'Atlas 0777' and tell me its author."
  expect:
    answer_contains: ["Writer 178"]
  reference:
    - model_load: {model: Book, filter: {title: Atlas 0777}}
    - model_get: {model: Author, id: 278}
    - answer: "'Atlas 0777' was written by Writer 178."
- id: sdctest-L-02
  app: sdctest
  category: large-search
  role: regular
  prompt:
    - "Open the author list and search it for 'Writer 123'."
    - "Filter the list of authors by the text 'Writer 123'."
  expect:
    controller: sdc-list-view
    args: {model: Author}
    form: {controller: sdc-search-view, values: {search: Writer 123}}
    max_error_views: 0
  reference:
    - navigate: {path: "/~sdc-list-view~&model=Author"}
    - fill_form: {controller: sdc-search-view, values: {search: Writer 123}}
    - answer: "The author list is filtered by 'Writer 123'."
- id: sdctest-L-03
  app: sdctest
  category: large-search
  role: regular
  prompt:
    - "How many authors in the author list match the search 'Writer'?"
    - "Search the author list for 'Writer'. How many results are there?"
  expect:
    answer_contains: ["300"]
  reference:
    - navigate: {path: "/~sdc-list-view~&model=Author"}
    - fill_form: {controller: sdc-search-view, values: {search: Writer}}
    - answer: "300 authors match 'Writer'."
- id: sdctest-L-04
  app: sdctest
  category: large-navigation
  role: regular
  prompt:
    - "Open the detail page of the book 'Atlas 0456'."
    - "Show me the details of 'Atlas 0456'."
  expect:
    controller: sdc-detail-view
    args: {model: Book, pk: 557}
    max_error_views: 0
  reference:
    - model_load: {model: Book, filter: {title: Atlas 0456}}
    - navigate: {path: "/~sdc-detail-view~&model=Book&pk=557"}
    - answer: "The detail page of 'Atlas 0456' is open."
- id: sdctest-L-05
  app: sdctest
  category: large-paging
  role: regular
  prompt:
    - "Search the author list for 'Writer', go to the next page of results and tell me which author is listed first there."
    - "In the author list filtered by 'Writer', which author is the first one on the second page?"
  expect:
    answer_contains: ["Writer 003"]
  reference:
    - navigate: {path: "/~sdc-list-view~&model=Author"}
    - fill_form: {controller: sdc-search-view, values: {search: Writer}}
    - click: {text: Next}
    - answer: "The first author on the second page is Writer 003."
