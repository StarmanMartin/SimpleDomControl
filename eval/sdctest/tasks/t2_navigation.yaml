- id: sdctest-T2-12
  app: sdctest
  category: navigation
  role: regular
  prompt:
    - "Show me the details of the book 'Compiler Design Basics'."
    - "Open the detail view of 'Compiler Design Basics'."
  expect:
    controller: sdc-detail-view
    args: {model: Book, pk: 8}
    max_error_views: 0
  reference:
    - model_load: {model: Book, filter: {title: Compiler Design Basics}}
    - navigate: {path: "/~sdc-detail-view~&model=Book&pk=8"}
    - answer: "Here are the details of 'Compiler Design Basics'."
