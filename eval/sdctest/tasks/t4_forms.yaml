# T4 Form filling: the right form, the right values, never saved (the database must stay unchanged).
- id: sdctest-T4-01
  app: sdctest
  category: form
  role: regular
  prompt:
    - "Prepare a new author: Rosalind Franklin, age 37. Don't save it, I will check it first."
    - "Fill in a new author named Rosalind Franklin, 37 years old. I'll click create myself."
  expect:
    form: {model: Author, pk: -1, values: {name: Rosalind Franklin, age: "37"}}
  reference:
    - navigate: {path: "/~sdc-model-form~&model=Author"}
    - read_page: {}
    - fill_form: {model: Author, values: {name: Rosalind Franklin, age: 37}}
    - answer: "I filled in the form; please check it and click Create."
- id: sdctest-T4-02
  app: sdctest
  category: form
  role: regular
  prompt:
    - "Prepare a new book 'The blue story' by Nina. I'll save it myself."
    - "Fill in a new book titled 'The blue story', author Nina, but don't create it."
  expect:
    form: {model: Book, pk: -1, values: {title: The blue story, author: "3"}}
  reference:
    - navigate: {path: "/~sdc-model-form~&model=Book"}
    - read_page: {}
    - fill_form: {model: Book, values: {title: The blue story, author: "3"}}
    - answer: "The form is filled in; please check it and click Create."
- id: sdctest-T4-03
  app: sdctest
  category: form
  role: regular
  prompt:
    - "Change the age of the author Artin to 25 in his edit form."
    - "Open Artin's edit form and set his age to 25."
  expect:
    form: {model: Author, pk: 4, values: {age: "25"}}
    allow_db_changes: true
  reference:
    - navigate: {path: "/~sdc-model-form~&model=Author&pk=4"}
    - read_page: {}
    - fill_form: {model: Author, pk: 4, values: {age: 25}}
    - answer: "I set Artin's age to 25; the edit form saved it. Use Restore to undo it."
