[project]
name = "SimpleDomControl"
version = "0.161.0"
description = "Simple DOM control -> a django MVC framework"
authors = [{ name = "Martin Starman", email = "private@martin-starman.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<4.0"
keywords = ["django", "MVC"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Django",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
]
dependencies = [
    "daphne (>=4.2.1,<5.0.0)",
    "channels (>=4.3.2,<5.0.0)",
    "channels-redis (>=4.3.0,<5.0.0)",
    "django (>=6.0.2,<7.0.0)",
    "attrs (>=25.4.0,<26.0.0)",
    "regex (>=2026.1.15,<2027.0.0)",
    "click (>=8.1.0)",
    "pyjwt (>=2.11.0,<3.0.0)",
    "inquirerpy (>=0.3.4,<0.4.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
]

[project.optional-dependencies]
# PostgreSQL driver: pip install "simpledomcontrol[postgres]"
postgres = ["psycopg2-binary (>=2.9.11,<3.0.0)"]
# AI assistant (<sdc-ai-assistant>, SDCAiConsumer): pip install "simpledomcontrol[ai]"
ai = ["anthropic (>=2.3.0,<3.0.0)", "openai (>=3.41.0,<4.0.0)"]
# sdc_teach (crawls the UI to write the AI skill file; development only): pip install "simpledomcontrol[teach]"
teach = ["playwright (>=1.64.0,<2.0.0)"]

[project.urls]
homepage = "https://github.com/StarmanMartin/SimpleDomControl"
repository = "https://github.com/StarmanMartin/SimpleDomControl"
documentation = "https://simpledomcontrol.readthedocs.io/en/latest/"
changelog = "https://github.com/StarmanMartin/SimpleDomControl/blob/master/CHANGELOG.md"

[project.scripts]
sdc = "sdc.__main__:cli"

[tool.poetry]
packages = [{include = "sdc_core"}, {include = "sdc_user"}, {include = "sdc_tools"}, {include = "sdc"}]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pillow = "^12.1.0"
sphinx = "^9.1.0"
sphinx-toolbox = "^4.1.2"
sphinx-markdown-builder = "^0.6.9"
sphinx-rtd-theme = "^3.1.0"

[tool.pytest.ini_options]
pythonpath = [
    "."
]
testpaths = [
    "pytests",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
